[project]
name = "mvoi"
version = "0.1.0"
description = "Miami Valley Operations Intelligence — Microsoft Fabric real-time geospatial demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Publishing to Fabric Eventstream (Event Hubs-compatible custom endpoint).
fabric = [
    "azure-eventhub>=5.12",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
]

[project.scripts]
mvoi = "mvoi.main:main"
# Local presenter app (needs the `fabric` extra for az sign-in): docs/presenter.md
mvoi-presenter = "mvoi.presenter.server:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
]
# Local/CI Spark tests — versions match Fabric Runtime 1.3 (Spark 3.5, Delta 3.2).
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pandas>=2.1",
    "pyarrow>=14",
]
# Only for scripts/build_reference_data.py (not needed at runtime).
tools = [
    "pyshp>=2.3",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvoi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real public APIs (needs network and, for OHGO, OHGO_API_KEY)",
    "spark: needs a local PySpark + Java runtime",
]
addopts = "-m 'not live and not spark'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Declarative specs (semantic model tables, deploy payloads) read better unwrapped.
"src/mvoi/deploy/semantic.py" = ["E501"]
"scripts/deploy_fabric.py" = ["E501"]
